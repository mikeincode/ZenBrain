kind = "web"
previewPath = "/"
title = "ZenBrain"
version = "1.0.0"
id = "artifacts/zenbrain"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20856

[services.development]
run = "pnpm --filter @workspace/zenbrain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zenbrain", "run", "build" ]
publicDir = "artifacts/zenbrain/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20856"
BASE_PATH = "/"
